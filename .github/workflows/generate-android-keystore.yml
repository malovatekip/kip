name: Generate Android Keystore

# One-time setup workflow — run this manually ONCE (Actions tab → this
# workflow → "Run workflow"), then follow the steps below. It generates the
# signing key Play Store requires every future release build to reuse, since
# neither this machine nor the developer's PC has a local JDK/keytool.
#
# After running:
#   1. Download the "kip-release-keystore" artifact from this run.
#   2. Open credentials.txt inside it — it has the 4 values you need.
#   3. Add them as repo secrets: Settings → Secrets and variables → Actions →
#      New repository secret, one each for:
#        ANDROID_KEYSTORE_BASE64
#        ANDROID_KEYSTORE_PASSWORD
#        ANDROID_KEY_ALIAS
#        ANDROID_KEY_PASSWORD
#   4. Delete this run (Actions → this run → "..." → Delete workflow run) once
#      the secrets are saved — the artifact is the only copy of your signing
#      key outside GitHub secrets, don't leave it sitting in run history.
#   5. Also save release.keystore + credentials.txt somewhere safe of your
#      own (e.g. a password manager) — if you ever lose it, you can NEVER
#      update the Play Store app again under the same listing.

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + credentials file
        run: |
          STORE_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"
          KEY_PASS="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)"

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias kip -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=KIP, OU=Malovate, O=Malovate, L=Lusaka, ST=Lusaka, C=ZM" \
            -storetype JKS

          base64 -w0 release.keystore > release.keystore.base64.txt

          cat > credentials.txt <<EOF
          ANDROID_KEYSTORE_BASE64=$(cat release.keystore.base64.txt)
          ANDROID_KEYSTORE_PASSWORD=$STORE_PASS
          ANDROID_KEY_ALIAS=kip
          ANDROID_KEY_PASSWORD=$KEY_PASS
          EOF

          echo "## Keystore generated ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **kip-release-keystore** artifact below, then follow the setup steps in this workflow's file header (.github/workflows/generate-android-keystore.yml)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: kip-release-keystore
          path: |
            release.keystore
            credentials.txt
          retention-days: 7
