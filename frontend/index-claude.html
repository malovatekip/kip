<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2B7FFF" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KIP" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72.png" />

    <!-- SEO / Social -->
    <title>KIP — Kwacha Intelligence Platform</title>
    <meta name="description" content="Zambia's AI-powered business intelligence advisor. Get personalised business ideas, daily coaching, and financial guidance." />
    <meta name="keywords" content="Zambia, business, entrepreneur, AI, KIP, Kwacha, SME" />

    <!-- Open Graph -->
    <meta property="og:title" content="KIP — Kwacha Intelligence Platform" />
    <meta property="og:description" content="Zambia's AI-powered business intelligence advisor." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />

    <!-- Prevent zoom on input focus (iOS) -->
    <style>
      input, select, textarea { font-size: 16px !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[KIP SW] Registered:', reg.scope))
            .catch(err => console.log('[KIP SW] Failed:', err))
        })
      }
    </script>
  </body>
</html>
