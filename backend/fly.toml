# fly.toml — KIP backend
# Deploy from the backend/ directory: `fly deploy` (run with cwd = backend/)

app = "kip-backend"
primary_region = "jnb"

[build]

[env]
  CHROMA_VOLUME_PATH = "/data"
  ENVIRONMENT = "production"

[[mounts]]
  source = "kip_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "10s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
